<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-on-surface-variant px-1" for="hourly_rate">Your Hourly Rate</label>

<script>
        function updateCalculation() {
            const rate = document.getElementById('hourly_rate').value;
            const fee = 0.10; // 10% platform fee
            const received = rate * (1 - fee);
            document.getElementById('estimated_calc').innerText = '$' + received.toFixed(2);
        }

        // Add visual micro-interactions
        document.querySelectorAll('input, select, textarea').forEach(el => {
            el.addEventListener('focus', () => {
                el.parentElement.classList.add('scale-[1.01]');
            });
            el.addEventListener('blur', () => {
                el.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>
