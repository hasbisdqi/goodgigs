<script>
    // Slider Logic
    const sliderKnob = document.getElementById('slider-knob');
    const sliderContainer = document.getElementById('slider-container');
    const sliderFill = document.getElementById('slider-fill');
    
    let isDragging = false;
    let startX = 0;
    let currentX = 0;
    const maxSlide = sliderContainer.offsetWidth - sliderKnob.offsetWidth - 16; // 16 for padding

    function startSlide(e) {
      isDragging = true;
      startX = (e.type === 'touchstart') ? e.touches[0].clientX : e.clientX;
      document.addEventListener('mousemove', moveSlide);
      document.addEventListener('mouseup', endSlide);
      document.addEventListener('touchmove', moveSlide);
      document.addEventListener('touchend', endSlide);
    }

    function moveSlide(e) {
      if (!isDragging) return;
      const x = (e.type === 'touchmove') ? e.touches[0].clientX : e.clientX;
      currentX = Math.max(0, Math.min(x - startX, maxSlide));
      
      sliderKnob.style.transform = `translateX(${currentX}px)`;
      sliderFill.style.width = `${currentX + 56}px`;

      // Visual feedback on completion
      if (currentX >= maxSlide * 0.95) {
        sliderKnob.classList.add('bg-primary');
        sliderKnob.classList.remove('bg-secondary');
      } else {
        sliderKnob.classList.add('bg-secondary');
        sliderKnob.classList.remove('bg-primary');
      }
    }

    function endSlide() {
      if (!isDragging) return;
      isDragging = false;
      
      if (currentX >= maxSlide * 0.9) {
        // Successful slide
        sliderKnob.style.transform = `translateX(${maxSlide}px)`;
        sliderFill.style.width = '100%';
        completeAction();
      } else {
        // Reset
        sliderKnob.style.transform = `translateX(0px)`;
        sliderFill.style.width = '0px';
      }
      
      document.removeEventListener('mousemove', moveSlide);
      document.removeEventListener('mouseup', endSlide);
      document.removeEventListener('touchmove', moveSlide);
      document.removeEventListener('touchend', endSlide);
    }

    function completeAction() {
      sliderKnob.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span>';
      setTimeout(() => {
        sliderKnob.innerHTML = '<span class="material-symbols-outlined">check</span>';
        alert('Job Started Successfully!');
        // Transition to active job state logic here
      }, 1000);
    }

    // Dynamic Time Update simulation

      const etaElements = document.querySelectorAll('.animate-pulse');
      // Just some visual liveliness
    }, 3000);
  </script>
